name: Release

# Builds the Android APK. Pushing a version tag (v2.1, v2.1.0, …) also publishes it as a GitHub Release.
# A manual run builds the APK as a workflow artifact; run it on a tag to (re)publish that tag's release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Signing secrets (see docs/development.md). Without them a debug APK is built instead.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        id: build
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            ./gradlew :engine:test :app:assembleRelease
            apk="pushy-island-$version.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set, building a debug APK instead of a signed release APK."
            ./gradlew :engine:test :app:assembleDebug
            apk="pushy-island-$version-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always() && env.ANDROID_KEYSTORE_PATH != ''
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.apk }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            flags=()
            # Unsigned debug builds and tags like v2.1-beta are published as pre-releases.
            if [ "$SIGNED" != "true" ] || [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "$APK" --verify-tag --title "Pushy Island $GITHUB_REF_NAME" \
              --generate-notes "${flags[@]}"
          fi
